<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy FastLife</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            /* Effetto griglia in sottofondo */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-text {
            color: hsl(284, 100%, 50%);
            text-shadow: 0 0 20px rgba(112, 3, 139, 0.4);
        }
        .glow-button {
            box-shadow: 0 0 25px rgba(239, 21, 255, 0.5);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center px-4">

    <div class="flex gap-3 mb-8">
        <span class="px-4 py-1 rounded-full border border-purple-900/50 bg-purple-900/20 text-purple-400 text-sm">
        </span>
    </div>
<div class="text-center max-w-3xl flex flex-col items-center">
    
    <h1 class="text-5xl md:text-6xl font-black mb-6 tracking-tight">
        <span class="glow-text italic">Energy FastLife</span>
    </h1>

    <div class="logo-container w-28 h-28 md:w-36 md:h-36 rounded-full overflow-hidden mb-8 bg-black flex items-center justify-center border-2 border-purple-500/30">
        <img src="Energy logo.png" alt="Energy" class="w-2/3 h-2/3 object-contain">
    </div>

    <p class="text-gray-300 text-lg md:text-xl leading-relaxed mb-10 px-4">
      Siamo un gruppo di Biker che ha creato <b>Energy FastLife</b> una nuova <b>famiglia</b>. Dove tutti saranno accetati!
    </p>

    <div class="flex flex-wrap justify-center gap-4">
        <a href="https://discord.gg/gpj5fHdG8" class="glow-button px-10 py-4 bg-magenta-600 hover:bg-purple-700 text-white font-bold rounded-2xl transition-all text-xl">
            Discord
        </a>
    </div>
</div>
        </div>
</div>

</body>
</html>
